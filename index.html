<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <meta name="description" content="La Fédération Centrafricaine de Musique : agenda des concerts et festivals, Radio FECAM, dernières sorties et adhésion." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FECAM — Fédération Centrafricaine de Musique</title>
    <meta name="theme-color" content="#1A1612" />
    <!-- Écran de chargement affiché avant le démarrage de React (remplacé au premier rendu) -->
    <style>
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1612; }
      #splash .word { font: 400 44px/1 Impact, 'Anton', sans-serif; letter-spacing: .01em; color: #f7f3ec; }
      #splash .word b { color: #e8742f; font-weight: 400; }
      #splash .bars { display: flex; align-items: flex-end; gap: 6px; height: 32px; margin-top: 40px; }
      #splash .bars i { width: 6px; border-radius: 9px; background: #e8742f; transform-origin: bottom; animation: splash-eq .9s ease-in-out infinite; }
      @keyframes splash-eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { #splash .bars i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" role="status" aria-label="Chargement">
        <div class="word">FECA<b>M</b></div>
        <div class="bars" aria-hidden="true">
          <i style="height:55%"></i><i style="height:90%;animation-delay:.11s"></i><i style="height:40%;animation-delay:.22s"></i><i style="height:100%;animation-delay:.33s"></i><i style="height:65%;animation-delay:.44s"></i><i style="height:80%;animation-delay:.55s"></i><i style="height:45%;animation-delay:.66s"></i>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
